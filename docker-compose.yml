# OpenMRS 3 for this implementation, generated by Implementer AI.
# Based on the OpenMRS 3 reference application docker compose,
# openmrs/openmrs-distro-referenceapplication.
# Start: docker compose up -d, then open http://<server>/openmrs/spa
# The first start takes 15 to 20 minutes while the database is created.
# Configuration folders are mounted as folders: the backend reads them when it
# starts, so a deploy recreates the containers after a change.
services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-3.8.0}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-3.8.0}
    restart: unless-stopped
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json,/openmrs/spa/site-config/implementer-ai-demo-org-frontend-config.json
      SPA_DEFAULT_LOCALE: en
    volumes:
      - ./configs/openmrs/frontend_config:/usr/share/nginx/html/site-config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - backend

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-3.8.0}
    restart: unless-stopped
    depends_on:
      - db
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
      - ./configs/openmrs/initializer_config/globalproperties:/openmrs/distribution/openmrs_config/globalproperties/site:ro
      - ./configs/openmrs/initializer_config/patientidentifiertypes:/openmrs/distribution/openmrs_config/patientidentifiertypes/site:ro
      - ./configs/openmrs/initializer_config/idgen:/openmrs/distribution/openmrs_config/idgen/site:ro
      - ./configs/openmrs/initializer_config/ampathforms:/openmrs/distribution/openmrs_config/ampathforms/site:ro
      - ./configs/openmrs/initializer_config/ampathformstranslations:/openmrs/distribution/openmrs_config/ampathformstranslations/site:ro

  db:
    image: mariadb:10.11.7
    restart: unless-stopped
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql

volumes:
  openmrs-data: ~
  db-data: ~
