# Deploy to UAT, generated by Implementer AI. Never production.
# Started from the AI client (deploy_task) or the task page on a pull request's
# branch, the base branch or a uat/ release candidate: it deploys what it was started on.
# Needs: the GitHub environment "uat" (Settings > Environments, deployment
# branches restricted) and the secret SERVER_SSH_KEY (the server's SSH private
# key), which Implementer AI writes there from your vault when the deploy starts.
# Optional secret SERVER_USER (default root).
# The first start of OpenMRS 3 on a new server can take 15 to 20 minutes: the
# check at the end waits up to 20 minutes. Containers are recreated when the copy
# changed a file, because configuration mounted from the repository (such as
# OpenMRS Initializer files) is read only when a container starts.
name: Deploy to UAT

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Test environment
        required: true
        type: choice
        options:
          - uat
        default: uat
      host:
        description: Server address (host name or IP)
        required: true
        default: '78.232.54.92'
      app_dir:
        description: Folder on the server
        required: false
        default: '/opt/implementer-ai'
      compose_file:
        description: Compose file in that folder
        required: false
        default: 'docker-compose.yml'
      health_url:
        description: Address checked after the restart (empty = no check)
        required: false
        default: 'http://78.232.54.92/openmrs'

concurrency:
  group: implementer-ai-deploy-uat
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: uat
    steps:
      - name: Refuse production
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          case "$(printf '%s' "$TARGET" | tr '[:upper:]' '[:lower:]')" in
            *prod*|live|main|master) echo "Implementer AI never deploys to production."; exit 1;;
          esac

      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ inputs.host }}
        run: |
          if [ -z "${SSH_KEY:-}" ]; then echo "The secret SERVER_SSH_KEY is missing. Add it in Implementer AI (Settings > Environments and variables > Secrets, granted to Deploy)."; exit 1; fi
          if [ -z "${HOST:-}" ]; then echo "No server address. Set a domain or an address on the environment."; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          KNOWN="${RUNNER_TEMP:-/tmp}/known"
          # A server just started (or created) takes a minute or two to answer: wait up to 5 minutes.
          for i in $(seq 1 30); do
            if ssh-keyscan -T 10 -H "$HOST" > "$KNOWN" 2>/dev/null && [ -s "$KNOWN" ]; then break; fi
            echo "Waiting for $HOST to answer SSH ($i)..."; sleep 10
          done
          if [ ! -s "$KNOWN" ]; then echo "$HOST does not answer SSH. Is the server started?"; exit 1; fi
          cat "$KNOWN" >> ~/.ssh/known_hosts

      - name: Copy this version to the server
        env:
          HOST: ${{ inputs.host }}
          APP_DIR: ${{ inputs.app_dir }}
          SSH_USER: ${{ secrets.SERVER_USER || 'root' }}
        run: |
          # Docker may still be installing on a new server: wait until its daemon answers (up to 5 minutes).
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$HOST" "for i in \$(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 10; done; docker info >/dev/null 2>&1 || { echo 'Docker is not running on the server after 5 minutes.'; exit 1; }; mkdir -p '$APP_DIR'"
          CHANGES="${RUNNER_TEMP:-/tmp}/changes"
          rsync -rlpz --checksum --itemize-changes --exclude .git --exclude .github --exclude .env --exclude '.env.*' -e "ssh -i $HOME/.ssh/id_deploy" ./ "$SSH_USER@$HOST:$APP_DIR/" > "$CHANGES"
          if [ -s "$CHANGES" ]; then
            echo "Changed on the server: $(wc -l < "$CHANGES") file(s) or folder(s)."
            CHANGED=1
            echo "CHANGED=1" >> "${GITHUB_ENV:-/dev/null}"
          else
            echo "Nothing changed on the server."
          fi

      - name: Restart
        env:
          HOST: ${{ inputs.host }}
          APP_DIR: ${{ inputs.app_dir }}
          COMPOSE: ${{ inputs.compose_file }}
          SSH_USER: ${{ secrets.SERVER_USER || 'root' }}
        run: |
          RECREATE=""
          if [ "${CHANGED:-0}" = "1" ]; then RECREATE="--force-recreate"; fi
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$HOST" "cd '$APP_DIR' && docker compose -f '$COMPOSE' pull --ignore-buildable && docker compose -f '$COMPOSE' up -d --build --remove-orphans $RECREATE"

      - name: Check it answers
        if: ${{ inputs.health_url != '' }}
        env:
          URL: ${{ inputs.health_url }}
        run: |
          if [ -z "${URL:-}" ]; then echo "No address to check."; exit 0; fi
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null --max-time 10 "$URL"; then echo "Up: $URL"; exit 0; fi
            sleep 10
          done
          echo "Not answering after 20 minutes: $URL"; exit 1
